name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install numpy pytest opencv-python-headless
      - name: Compile source
        run: python -m compileall -q asl
      - name: Run tests
        run: python -m pytest -q
