name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify OpenCV import
        run: python -c "import cv2, numpy, pytest; print('OpenCV', cv2.__version__)"
      - name: Compile source
        run: python -m compileall -q asl apps
      - name: Run tests
        run: python -m pytest -q
