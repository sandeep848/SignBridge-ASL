name: Model smoke tests
on:
  push:
    paths:
      - 'asl/**'
      - 'tests/test_model_shapes.py'
      - 'requirements.txt'
      - '.github/workflows/model-smoke.yml'
  pull_request:
  workflow_dispatch:
jobs:
  tensorflow-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate model signatures and MediaPipe compatibility
        run: |
          python -c "import tensorflow as tf, mediapipe as mp; assert hasattr(mp, 'solutions'); print('TensorFlow', tf.__version__)"
          python -m pytest -q tests/test_model_shapes.py
