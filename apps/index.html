<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignBridge ASL</title><style>body{font:16px system-ui;background:#f6f8fa;color:#18212b;margin:0}main{max-width:1050px;margin:36px auto;padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:white;border:1px solid #dde3e8;border-radius:9px;padding:20px}video{width:100%;background:#19222b;border-radius:8px}button{background:#174b86;color:white;border:0;border-radius:6px;padding:11px 15px;margin:8px 8px 8px 0;cursor:pointer}textarea{width:100%;height:120px;box-sizing:border-box;font:inherit}.muted{color:#5d6875}@media(max-width:740px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>SignBridge</h1><p class="muted">ASL research recognizer. Trained model checkpoints are required.</p><div class="grid"><section class="panel"><h2>Camera recognition</h2><video id="camera" autoplay muted playsinline></video><canvas id="canvas" hidden></canvas><button id="start">Start camera</button><button id="stop">Stop</button><p role="status" id="status">Stopped.</p><p>Detected: <strong id="sign">—</strong></p></section><section class="panel"><h2>Text</h2><textarea id="text" aria-label="Recognized text"></textarea><button id="speak">Speak</button><button id="clear">Clear</button><h2>Isolated-sign video</h2><input id="clip" type="file" accept="video/mp4,video/webm,video/quicktime"><button id="analyze">Analyze</button><p role="status" id="result"></p></section></div></main><script>
const el=id=>document.getElementById(id);let stream=null,timer=null,busy=false,last=null,votes=0,latched=null,absent=0,retries=0;
el('start').onclick=async()=>{try{if(stream)return;stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});el('camera').srcObject=stream;el('status').textContent='Camera active';retries=0;timer=setInterval(tick,350)}catch(e){el('status').textContent=e.message}};
el('stop').onclick=()=>{clearInterval(timer);timer=null;busy=false;retries=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;el('camera').srcObject=null;el('status').textContent='Stopped'};
function emit(label){if(!label){absent++;if(absent>=3){last=null;votes=0;latched=null}return}absent=0;if(last===label)votes++;else{last=label;votes=1}if(votes<4||latched===label)return;latched=label;let key=label.toLowerCase();if(key==='nothing')return;if(key==='space')el('text').value+=' ';else if(key==='del')el('text').value=el('text').value.slice(0,-1);else el('text').value+=label}
async function tick(){if(!stream||busy||!el('camera').videoWidth)return;busy=true;try{let c=el('canvas');c.width=640;c.height=480;c.getContext('2d').drawImage(el('camera'),0,0,640,480);let image=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',0.78));let form=new FormData();form.append('image',image,'frame.jpg');let r=await fetch('/api/static/predict',{method:'POST',body:form});let result=await r.json();if(!r.ok){el('status').textContent=result.detail||'Inference unavailable';if(r.status===503){el('stop').click();return}throw Error('Request failed: '+r.status)}retries=0;el('sign').textContent=result.label||'Uncertain';emit(result.label)}catch(e){el('status').textContent=e.message;retries++;if(retries>=5){el('stop').click();return}}finally{busy=false}}
el('speak').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(el('text').value))}};
el('clear').onclick=()=>{el('text').value='';last=null;votes=0;latched=null};
el('analyze').onclick=async()=>{let file=el('clip').files[0];if(!file)return;let form=new FormData();form.append('video',file);el('result').textContent='Processing video';try{let response=await fetch('/api/temporal/predict',{method:'POST',body:form});let data=await response.json();el('result').textContent=response.ok?('Sign: '+(data.label||'Uncertain')+' | confidence '+(data.confidence*100).toFixed(1)+'%'):(data.detail||'Unavailable')}catch(error){el('result').textContent=error.message}};
</script></body></html>
